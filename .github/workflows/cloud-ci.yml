name: Cloud CI

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:
    inputs:
      api_url:
        description: "Public API URL for post-deploy smoke"
        required: false
        type: string
      web_url:
        description: "Public web URL for post-deploy smoke"
        required: false
        type: string

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Node dependencies
        run: npm ci

      - name: Install API dependencies
        run: pip install -r apps/api/requirements.txt

      - name: Lint
        run: npm run lint

      - name: Web tests
        run: npm run test

      - name: Web build
        run: npm run build

      - name: API tests
        run: cd apps/api && python -m pytest -q

      - name: Production gate fast
        shell: pwsh
        run: ./scripts/production-gate.ps1 -Fast

  post_deploy_smoke:
    if: github.event_name == 'workflow_dispatch' && inputs.api_url != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run cloud smoke
        shell: pwsh
        env:
          LEXFLOW_API_URL: ${{ inputs.api_url }}
          LEXFLOW_WEB_URL: ${{ inputs.web_url }}
          LEXFLOW_SMOKE_TENANT_SLUG: ${{ secrets.LEXFLOW_SMOKE_TENANT_SLUG }}
          LEXFLOW_SMOKE_ADMIN_EMAIL: ${{ secrets.LEXFLOW_SMOKE_ADMIN_EMAIL }}
          LEXFLOW_SMOKE_ADMIN_PASSWORD: ${{ secrets.LEXFLOW_SMOKE_ADMIN_PASSWORD }}
        run: ./scripts/cloud-smoke.ps1
